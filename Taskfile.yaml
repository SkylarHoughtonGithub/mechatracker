version: '3'

vars:
  CLUSTER_NAME: mechatracker
  REGISTRY_NAME: mechatracker-registry
  REGISTRY_PORT: 5050
  K8S_NAMESPACE: mechatracker-dev
  API_IMAGE_PUSH: localhost:{{.REGISTRY_PORT}}/mechatracker/api
  API_IMAGE_PULL: mechatracker-registry:{{.REGISTRY_PORT}}/mechatracker/api
  WEB_IMAGE_PUSH: localhost:{{.REGISTRY_PORT}}/mechatracker/web
  WEB_IMAGE_PULL: mechatracker-registry:{{.REGISTRY_PORT}}/mechatracker/web

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── Setup ────────────────────────────────────────────────────────────────────

  setup:
    desc: "Full one-time setup: tools → env → cluster → helm"
    cmds:
      - task: setup:tools
      - task: setup:env
      - task: setup:buildx
      - task: setup:cluster
      - task: setup:helm

  setup:tools:
    desc: "Install all dev dependencies via Homebrew and go install"
    cmds:
      - brew install go node k3d kubectl helm sqlc golang-migrate docker-buildx libpq
      - go install github.com/vektra/mockery/v2@latest
      - go install github.com/swaggo/swag/cmd/swag@latest
      - npm install -g swagger2openapi openapi-typescript
      - |
        echo ""
        echo "⚠️  If mockery/swag are not found, add Go binaries to your PATH:"
        echo "   echo 'export PATH=\"\$PATH:\$(go env GOPATH)/bin\"' >> ~/.zshrc"
        echo "   source ~/.zshrc"
        echo ""

  setup:env:
    desc: "Copy api/.env.example → api/.env if it does not exist"
    status:
      - test -f api/.env
    cmds:
      - cp api/.env.example api/.env
      - echo "api/.env created — dev defaults work out of the box"

  setup:buildx:
    desc: "Link buildx plugin and create a multi-platform builder"
    status:
      - docker buildx inspect mechatracker
    cmds:
      - mkdir -p ~/.docker/cli-plugins
      - ln -sf $(brew --prefix docker-buildx)/bin/docker-buildx ~/.docker/cli-plugins/docker-buildx
      - |
        docker buildx create \
          --name=mechatracker \
          --driver=docker-container \
          --driver-opt=network=host \
          --config={{.ROOT_DIR}}/infra/buildkit/buildkitd.toml \
          --bootstrap \
          --use

  setup:cluster:
    desc: "Create the k3d cluster and local image registry"
    status:
      - k3d cluster get {{.CLUSTER_NAME}}
    cmds:
      - k3d cluster create --config ./infra/k3d/config.yaml --wait
      - kubectl create namespace {{.K8S_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -

  setup:helm:
    desc: "Add Helm repos (no chart dependencies currently)"
    cmds:
      - helm repo update || true

  # ── Dev ──────────────────────────────────────────────────────────────────────

  dev:
    desc: "Build, deploy, and migrate — the main inner loop"
    cmds:
      - task: api:image:push
      - task: web:image:push
      - task: helm:upgrade
      - task: db:wait
      - task: dev:hosts
      - echo "✓  http://localhost:8080"
      - echo "✓  Web  http://web.localhost:8080"
      - echo "   Run 'task db:forward' then 'task db:migrate' to apply migrations"
      - echo "   Then seed dev user by running 'task db:seed:user'"
      - task: dev:tunnels
  
  dev:hosts:
  desc: "Check /etc/hosts has required entries for local dev"
  cmds:
    - |
      missing=0
      for host in "web.localhost"; do
        if ! grep -q "$host" /etc/hosts; then
          echo "✗ Missing /etc/hosts entry: 127.0.0.1 $host"
          missing=1
        else
          echo "✓ $host"
        fi
      done
      if [ $missing -eq 1 ]; then
        echo ""
        echo "Fix: sudo sh -c 'echo \"127.0.0.1 web.localhost\" >> /etc/hosts'"
        exit 1
      fi

  dev:status:
    desc: "Show cluster nodes and pod status"
    cmds:
      - kubectl get nodes
      - kubectl get pods -n {{.K8S_NAMESPACE}}

  dev:tunnels:
    desc: "Start API + web port-forwards in parallel"
    deps:
      - task: dev:pf:api
      - task: dev:pf:web

  dev:pf:api:
    internal: true
    cmds:
      - kubectl port-forward -n mechatracker-dev svc/mechatracker-api 8080:8080

  dev:pf:web:
    internal: true
    cmds:
      - kubectl port-forward -n mechatracker-dev svc/mechatracker-web 3000:3000

  # ── API ──────────────────────────────────────────────────────────────────────

  api:run:
    desc: "Run the API process locally (run task db:forward first)"
    dir: api
    cmds:
      - go run ./cmd/api

  api:test:
    desc: "Run Go tests"
    dir: api
    cmds:
      - go test ./...

  api:image:push:
    desc: "Build and push the API image to the local k3d registry"
    dir: api
    vars:
      PLATFORMS: '{{.PLATFORMS | default "linux/arm64"}}'
    cmds:
      - go mod tidy
      - |
        docker buildx build \
          --platform {{.PLATFORMS}} \
          --build-arg GOFLAGS=-p=2 \
          --tag {{.API_IMAGE_PUSH}}:latest \
          --push \
          .

  api:logs:
    desc: "Tail API pod logs"
    cmds:
      - kubectl logs -n {{.K8S_NAMESPACE}} -l app=mechatracker-api -f

  api:restart:
    desc: "Restart the API pod (e.g. after a config change)"
    cmds:
      - kubectl rollout restart deployment/mechatracker-api -n {{.K8S_NAMESPACE}}
      - kubectl rollout status deployment/mechatracker-api -n {{.K8S_NAMESPACE}}

  api:rollback:
      desc: "Roll back the API deployment to the previous version"
      cmds:
        - kubectl rollout undo deployment/mechatracker-api -n {{.K8S_NAMESPACE}}
        - kubectl rollout status deployment/mechatracker-api -n {{.K8S_NAMESPACE}}
      
  # ── Web ─────────────────────────────────────────────────────────────────────

  web:run:
    desc: "Run the Next.js dev server locally (no cluster needed)"
    dir: web
    cmds:
      - npm run dev
 
  web:image:push:
    desc: "Build and push the web image to the local k3d registry"
    dotenv: ['.env.build']
    # Build context is repo root so shared/ is accessible during build
    cmds:
      - |
        docker buildx build \
          --platform linux/arm64 \
          --file web/Dockerfile \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY} \
          --tag {{.WEB_IMAGE_PUSH}}:latest \
          --push \
          .
 
  web:logs:
    desc: "Tail web pod logs"
    cmds:
      - kubectl logs -n {{.K8S_NAMESPACE}} -l app=mechatracker-web -f
 
  web:restart:
    desc: "Restart the web pod (e.g. after an env change)"
    cmds:
      - kubectl rollout restart deployment/mechatracker-web -n {{.K8S_NAMESPACE}}
      - kubectl rollout status deployment/mechatracker-web -n {{.K8S_NAMESPACE}}

  web:rollback:
    desc: "Roll back the web deployment to the previous version"
    cmds:
      - kubectl rollout undo deployment/mechatracker-web -n {{.K8S_NAMESPACE}}
      - kubectl rollout status deployment/mechatracker-web -n {{.K8S_NAMESPACE}}

  # ── Helm ─────────────────────────────────────────────────────────────────────

  helm:upgrade:
    cmds:
      - |
        helm upgrade --install mechatracker ./infra/helm/mechatracker \
          --namespace {{.K8S_NAMESPACE}} \
          --values ./infra/helm/mechatracker/values.dev.yaml \
          --values ./infra/helm/mechatracker/values.dev.local.yaml \
          --set api.rollme="$(date +%s)" \
          --set web.rollme="$(date +%s)" \
          --wait --timeout 5m

  helm:rollback:
    desc: "Roll back both API and web deployments to their previous version"
    deps:
      - api:rollback
      - web:rollback

  helm:uninstall:
    desc: "Uninstall the Helm release (keeps the cluster)"
    cmds:
      - helm uninstall mechatracker --namespace {{.K8S_NAMESPACE}}

  # ── Database ─────────────────────────────────────────────────────────────────

  db:wait:
    desc: "Wait for Postgres to be ready"
    cmds:
      - |
        echo "Waiting for Postgres..."
        for i in $(seq 1 30); do
          if kubectl exec -n {{.K8S_NAMESPACE}} \
               statefulset/mechatracker-postgresql -- \
               pg_isready -U mechatracker &>/dev/null; then
            echo "✓ Postgres ready"
            exit 0
          fi
          sleep 2
        done
        echo "✗ Postgres timed out"; exit 1

  db:migrate:
    desc: "Run pending migrations (port-forward must be running, or use db:migrate:cluster)"
    dir: api
    dotenv: ['.env']
    cmds:
      - migrate -path ./migrations -database "$DATABASE_URL" up

  db:migrate:cluster:
    desc: "Run migrations via kubectl exec (no port-forward needed)"
    cmds:
      - |
        kubectl cp api/migrations mechatracker-postgresql-0:/tmp/migrations -n {{.K8S_NAMESPACE}}
        kubectl exec -n {{.K8S_NAMESPACE}} statefulset/mechatracker-postgresql -- \
          sh -c 'migrate -path /tmp/migrations -database "postgres://mechatracker:mechatracker@localhost:5432/mechatracker?sslmode=disable" up' 2>/dev/null \
          || echo "migrate not in container — run: task db:forward then task db:migrate"

  db:new:
    desc: "Create a new migration  (NAME=add_something)"
    dir: api
    cmds:
      - migrate create -ext sql -dir ./migrations -seq {{.NAME}}

  db:reset:
    desc: "Drop and re-run all migrations"
    prompt: "This destroys all local DB data. Continue?"
    dir: api
    dotenv: ['.env']
    cmds:
      - migrate -path ./migrations -database "$DATABASE_URL" drop -f
      - migrate -path ./migrations -database "$DATABASE_URL" up

  db:shell:
    desc: "Open a psql shell into the in-cluster Postgres"
    cmds:
      - |
        kubectl exec -it -n {{.K8S_NAMESPACE}} \
          statefulset/mechatracker-postgresql -- \
          psql -U mechatracker -d mechatracker

  db:forward:
    desc: "Port-forward Postgres to localhost:5432 (needed for task api:run)"
    cmds:
      - kubectl port-forward -n {{.K8S_NAMESPACE}} svc/mechatracker-postgresql 5432:5432

  # ── Code generation ──────────────────────────────────────────────────────────

  generate:
    desc: "Regenerate all generated files"
    cmds:
      - task: generate:sqlc
      - task: generate:mocks
      - task: generate:openapi
      - task: generate:ts

  generate:sqlc:
    dir: api
    cmds: [sqlc generate]

  generate:mocks:
    dir: api
    cmds: [mockery]

  generate:openapi:
    dir: api
    cmds: [swag init -g cmd/api/main.go -o openapi/ --parseDependency --parseInternal --overridesFile .swaggo]

  generate:ts:
    cmds:
      - swagger2openapi api/openapi/swagger.json -o api/openapi/openapi3.yaml
      - npx openapi-typescript api/openapi/openapi3.yaml -o shared/types/index.ts

  # ── Cluster lifecycle ────────────────────────────────────────────────────────

  cluster:delete:
    desc: "Tear down the cluster and registry"
    prompt: "This destroys the local cluster and all data. Continue?"
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME}}
      - k3d registry delete k3d-{{.REGISTRY_NAME}} || true

  # ── Infrastructure ───────────────────────────────────────────────────────────

  infra:plan:
    desc: "Preview Terraform changes"
    dir: infra/terraform
    cmds: [terraform plan]

  infra:apply:
    desc: "Apply Terraform changes"
    dir: infra/terraform
    cmds: [terraform apply]

