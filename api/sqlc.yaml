version: "2"

sql:
  - engine: "postgresql"
    queries: "queries"
    schema:  "migrations/000001_init.up.sql"
    gen:
      go:
        package:                    "store"
        out:                        "internal/store"
        sql_package:                "pgx/v5"
        emit_json_tags:             true
        emit_interface:             true
        emit_empty_slices:          true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:  "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.numeric"
            go_type:  "github.com/shopspring/decimal.Decimal"