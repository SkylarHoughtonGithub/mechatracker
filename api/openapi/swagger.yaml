        example: "2026-04-10T19:00:00Z"
        type: string
      id:
        example: a44d8522-66b3-4146-af64-9db60c72470a
        type: string
      make:
        example: Ford
        type: string
      mileage:
        example: 84200
        type: integer
      model:
        example: F-150
        type: string
      org_id:
        example: 00000000-0000-0000-0000-000000000003
        type: string
      trim:
        example: XLT
        type: string
      unit_label:
        type: string
      vin:
        type: string
      year:
        example: 2019
        type: integer
    type: object
  internal_handler.createNoteReq:
    properties:
      body:
        example: Noticed some scoring on the rotor — ordered replacement.
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - body
    type: object
  internal_handler.createPartReq:
    properties:
      cost:
        example: "34.99"
        type: string
      name:
        example: Brake pad set
        maxLength: 200
        type: string
      notes:
        type: string
      part_number:
        example: D1060-8J090
        type: string
      supplier:
        example: RockAuto
        type: string
    required:
    - name
    type: object
  internal_handler.createRepairReq:
    properties:
      assigned_to:
        type: string
      system:
        example: brakes
        maxLength: 100
        type: string
      template_id:
        type: string
      title:
        example: Brake pad replacement
        maxLength: 200
        type: string
      vehicle_id:
        example: a44d8522-66b3-4146-af64-9db60c72470a
        type: string
    required:
    - system
    - title
    - vehicle_id
    type: object
  internal_handler.createStepReq:
    properties:
      notes:
        example: Use 21mm socket
        type: string
      position:
        example: 1
        minimum: 1
        type: integer
      title:
        example: Remove wheel
        maxLength: 200
        type: string
      torque_spec:
        example: 100 ft-lbs
        type: string
    required:
    - position
    - title
    type: object
  internal_handler.createVehicleReq:
    properties:
      make:
        example: Ford
        maxLength: 100
        type: string
      mileage:
        example: 84200
        minimum: 0
        type: integer
      model:
        example: F-150
        maxLength: 100
        type: string
      trim:
        example: XLT
        type: string
      unit_label:
        example: 'Unit #07'
        maxLength: 50
        type: string
      vin:
        example: 1FTFW1ET5DFC10312
        type: string
      year:
        example: 2019
        maximum: 2100
        minimum: 1900
        type: integer
    required:
    - make
    - model
    - year
    type: object
  internal_handler.garageResponse:
    properties:
      org_name:
        type: string
      stats:
        $ref: '#/definitions/internal_handler.garageStats'
      vehicles:
        items:
          $ref: '#/definitions/internal_handler.garageVehicle'
        type: array
    type: object
  internal_handler.garageStats:
    properties:
      open_repairs:
        example: 2
        type: integer
      parts_spend_30d:
        example: 342.5
        type: number
      repairs_30d:
        example: 5
        type: integer
      total_vehicles:
        example: 4
        type: integer
    type: object
  internal_handler.garageSystemSummary:
    properties:
      has_open:
        example: true
        type: boolean
      id:
        example: brakes
        type: string
      label:
        example: Brakes
        type: string
      repair_count:
        example: 3
        type: integer
    type: object
  internal_handler.garageVehicle:
    properties:
      id:
        example: a44d8522-66b3-4146-af64-9db60c72470a
        type: string
      last_repair_at:
        example: "2026-03-15"
        type: string
      make:
        example: Ford
        type: string
      mileage:
        example: 84200
        type: integer
      model:
        example: F-150
        type: string
      open_repairs:
        example: 1
        type: integer
      systems:
        items:
          $ref: '#/definitions/internal_handler.garageSystemSummary'
        type: array
      trim:
        example: XLT
        type: string
      unit_label:
        type: string
      vin:
        type: string
      year:
        example: 2019
        type: integer
    type: object
  internal_handler.updatePartReq:
    properties:
      cost:
        example: "49.99"
        type: string
      name:
        example: Brake pad set — premium
        maxLength: 200
        type: string
      notes:
        type: string
      part_number:
        type: string
      supplier:
        example: NAPA
        type: string
    type: object
  internal_handler.updatePartStatusReq:
    properties:
      status:
        description: 'Status must follow the allowed progression: needed → ordered
          → in_stock → installed.'
        enum:
        - needed
        - ordered
        - in_stock
        - installed
        example: ordered
        type: string
    required:
    - status
    type: object
  internal_handler.updateRepairReq:
    properties:
      assigned_to:
        type: string
      status:
        description: Status transition — mutually exclusive with field edits.
        enum:
        - draft
        - in_progress
        - pending_parts
        - completed
        example: in_progress
        type: string
      system:
        example: brakes
        maxLength: 100
        type: string
      title:
        description: Field edits — all optional.
        example: Brake pad replacement
        maxLength: 200
        type: string
    type: object
  internal_handler.updateVehicleReq:
    properties:
      make:
        example: Ford
        maxLength: 100
        type: string
      mileage:
        example: 92000
        minimum: 0
        type: integer
      model:
        example: F-150
        maxLength: 100
        type: string
      trim:
        example: Lariat
        type: string
      unit_label:
        maxLength: 50
        type: string
      vin:
        type: string
      year:
        example: 2020
        maximum: 2100
        minimum: 1900
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: mechatracker support
  description: Repair tracking platform for mechanics, auto shops, and fleet managers.
  title: mechatracker API
  version: 0.1.0
paths:
  /garage:
    get:
      description: Returns all vehicles with per-system summaries and org-level stats
        in one call.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.garageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Aggregated garage view
      tags:
      - garage
  /repairs:
    get:
      description: Returns in-progress repairs assigned to or created by the caller.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.SwaggerActiveRepair'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List active repairs
      tags:
      - repairs
    post:
      consumes:
      - application/json
      description: Creates a new repair in draft status for a vehicle.
      parameters:
      - description: Repair details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createRepairReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SwaggerRepair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a repair
      tags:
      - repairs
  /repairs/{repairID}:
    delete:
      description: Hard-deletes a repair and writes a 30-day recoverable snapshot
        to deleted_items.
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SwaggerDeletedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a repair
      tags:
      - repairs
    get:
      description: Returns the repair record with its steps and parts in one response.
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SwaggerRepairDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a repair
      tags:
      - repairs
    patch:
      consumes:
      - application/json
      description: 'Handles two operations: status transition (provide `status`) or
        field edits (provide `title`/`system`/`assigned_to`). Completing a repair
        writes an immutable history snapshot.'
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateRepairReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SwaggerRepair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a repair
      tags:
      - repairs
  /repairs/{repairID}/notes:
    get:
      description: Returns all timestamped notes for a repair, newest last.
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.SwaggerRepairNote'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List notes on a repair
      tags:
      - repairs
    post:
      consumes:
      - application/json
      description: Creates a timestamped note on the repair, attributed to the caller.
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      - description: Note body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createNoteReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SwaggerRepairNote'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a note to a repair
      tags:
      - repairs
  /repairs/{repairID}/parts:
    post:
      consumes:
      - application/json
      description: Creates a part entry on a repair, starting in `needed` status.
        Cost is a decimal string e.g. "34.99".
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      - description: Part details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createPartReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SwaggerPart'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a part to a repair
      tags:
      - parts
  /repairs/{repairID}/parts/{partID}:
    delete:
      description: Removes a part from a repair. Only allowed when status is draft
        or in_progress.
      parameters:
      - description: Repair UUID
        format: uuid
        in: path
        name: repairID
        required: true
        type: string
      - description: Part UUID
        format: uuid
        in: path
        name: partID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'deleted: true, id: <uuid>'
          schema:
            $ref: '#/definitions/internal_handler.SwaggerDeletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mechatracker_api_internal_apierr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a part
      tags:
      - parts
    patch:
      consumes:
      - application/json
      description: Updates part fields (name, part_number, supplier, cost, notes).
