# values.dev.yaml — local developer workstation overrides.

# ── API ───────────────────────────────────────────────────────────────────────
api:
  replicaCount: 1
  image:
    repository: mechatracker-registry:5050/mechatracker/api
    tag: latest
    pullPolicy: Always

  env:
    ENV: development
    PORT: "8080"
    DATABASE_URL: "postgres://mechatracker:mechatracker@mechatracker-postgresql:5432/mechatracker?sslmode=disable"
    DEV_AUTH_BYPASS: "true"
    GOOGLE_CLIENT_ID: ""
    SESSION_SIGNING_KEY: ""
    SESSION_COOKIE_SECURE: "false"
    SESSION_TTL: "12h"
    SPACES_ENDPOINT: ""
    SPACES_BUCKET: ""
    SPACES_ACCESS_KEY: ""
    SPACES_SECRET_KEY: ""
    SENTRY_DSN: ""

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Web ───────────────────────────────────────────────────────────────────────
web:
  enabled: true
  replicaCount: 1
  image:
    repository: mechatracker-registry:5050/mechatracker/web
    tag: latest
    pullPolicy: Always

  env:
    # BACKEND_URL is server-side only; Next.js's /api/backend/* rewrite
    # forwards there, keeping the browser same-origin so the mt_session
    # cookie flows without SameSite=None/Secure gymnastics.
    BACKEND_URL: "http://mechatracker-api:8080"
    # Google OAuth client ID is baked into the client bundle at build time
    # (NEXT_PUBLIC_*). Dev doesn't need a real one when API runs with
    # DEV_AUTH_BYPASS=true — the sign-in page just won't produce a working
    # Google credential until this is filled.
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: web.localhost
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  enabled: true

  image:
    tag: "17"

  auth:
    username: mechatracker
    password: mechatracker
    database: mechatracker

  persistence:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi