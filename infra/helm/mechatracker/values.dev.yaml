# values.dev.yaml — local developer workstation overrides.

# ── API ───────────────────────────────────────────────────────────────────────
api:
  replicaCount: 1
  image:
    repository: mechatracker-registry:5050/mechatracker/api
    tag: latest
    pullPolicy: Always

  env:
    ENV: development
    PORT: "8080"
    DATABASE_URL: "postgres://mechatracker:mechatracker@mechatracker-postgresql:5432/mechatracker?sslmode=disable"
    CLERK_DEV_BYPASS: "false"
    CLERK_JWKS_URL: "https://daring-drake-86.clerk.accounts.dev/.well-known/jwks.json"
    CLERK_AUDIENCE: ""
    SPACES_ENDPOINT: ""
    SPACES_BUCKET: ""
    SPACES_ACCESS_KEY: ""
    SPACES_SECRET_KEY: ""
    SENTRY_DSN: ""

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Web ───────────────────────────────────────────────────────────────────────
web:
  enabled: true
  replicaCount: 1
  image:
    repository: mechatracker-registry:5050/mechatracker/web
    tag: latest
    pullPolicy: Always

  env:
    # Points at the API via the in-cluster service name.
    # In-cluster requests go service-to-service — no ingress hop needed.
    NEXT_PUBLIC_API_URL: "http://localhost:8080"
    INTERNAL_API_URL: "http://mechatracker-api:8080"

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: web.localhost
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  enabled: true

  image:
    tag: "17"

  auth:
    username: mechatracker
    password: mechatracker
    database: mechatracker

  persistence:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi