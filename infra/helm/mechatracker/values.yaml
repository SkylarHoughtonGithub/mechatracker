# values.yaml — chart defaults for local-dev k3d.
# Production deployment uses the KubeVela Application in skylab-gitops
# (workloads/mechatracker/) — not this chart. All secrets come from
# External Secrets Operator or plain K8s Secrets.

api:
  replicaCount: 2
  image:
    repository: ghcr.io/skylarhoughtongithub/mechatracker-api
    tag: ""         # set by CI at deploy time
    pullPolicy: IfNotPresent

  env: {}           # populated via K8s Secret

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/skylarhoughtongithub/mechatracker-web
    tag: ""         # set by CI at deploy time
    pullPolicy: IfNotPresent

  env: {}           # populated via K8s Secret

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: false    # prod uses a Crossplane-managed Postgres (Postgres XRD → RDS or CloudSQL)